name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install deps
        working-directory: mobile-app
        run: npm install

      - name: Add Android platform
        working-directory: mobile-app
        run: npx cap add android

      - name: Enable Jetifier for legacy Cordova plugins
        working-directory: mobile-app/android
        run: |
          echo "android.enableJetifier=true" >> gradle.properties
          cat gradle.properties

      - name: Sync
        working-directory: mobile-app
        run: npx cap sync android

      - name: Patch MainActivity for native Google login
        run: cp mobile-app/native-patches/MainActivity.java mobile-app/android/app/src/main/java/com/k/ikasumi/MainActivity.java

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile-app/android/app/novel-reader.keystore

      - name: Patch signing config
        working-directory: mobile-app/android/app
        run: |
          cat >> build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("novel-reader.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "novelreader"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: mobile-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ikasumi-novel-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk